name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Format, lint, unit tests
        working-directory: rust
        run: cargo fmt --check && cargo clippy --release --all-targets -- -D warnings && cargo test --release

  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: dtolnay/rust-toolchain@stable
      - name: Install
        run: |
          pip install -e ".[dev]"
          maturin build --release -m rust/Cargo.toml -o dist
          pip install dist/*.whl
      - name: Lint
        run: ruff check src tests scripts && ruff format --check src tests scripts
      - name: Tests (includes Rust vs NumPy bit-for-bit parity)
        run: pytest
      - name: Pipeline (fast)
        run: python -m plancast run --fast --out /tmp/reports && cat /tmp/reports/monitoring.md
